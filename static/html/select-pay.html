<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Выбор способа оплаты</title>
    <style>
        body{
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
        }

        .text-color-header {
            color: #5d5e5c;
        }

        .blok-panel{
            max-width: 500px;
            width: 80%;
            background-color: white;
            position: absolute;
            top: 30%;
            box-shadow: 1px 1px 9px 4px wheat;
            padding: 12px;
            text-align: center;
        }

        .blok-panel > h1 {
            color: #8f8c8c;
        }

        .blok-panel > .block-select {

            min-height: 83px;
            border-radius: 12px;

            display: flex;
            align-content: center;
            justify-content: space-around;
            flex-wrap: wrap;

            cursor: pointer;
            color: white;
            font-size: x-large;
        }

        #submitPayCard > span{
            margin-top: 21px;
        }
        #submitPaySBP > span{
            width: 50%;
        }

        .get-mail >h1 {
            color: #60bdc2;
        }

        .btn{
            height: 43px;
            color: #fff;
            border-radius: 8px;
            margin-top: 20px;
            background-image: linear-gradient(to right, #60bdc2, #66d6cd);
            box-shadow: 2px 3px 3px 0px #ccc6ce;
            border-color: #60bdc2;
            font-size: 1.25rem;
            line-height: 1.5;
            letter-spacing: 0.09em;
            padding-left: 10px;
            padding-right: 10px;
            cursor: pointer;
            font-family: initial;
        }

        .btn:disabled {
            background-color: #bac8da;
            border-color: #bac8da;
            background-image: none;
        }

        .block-get-email{
            display: flex;
            margin-bottom: 15px;
        }
        .block-get-email-num > img{
            width: 50px;
        }

        .block-get-email-date{
            text-align: left;
            margin-left: 15px;
            width: 100%;
            padding-top: 37px;
        }
        .block-get-email-date > h1{
            margin: 0;
            font-size: 23px;
            font-weight: 500;
        }
        .block-get-email-date-input-btn {
            display: flex;
        }
        .block-get-email-date-input-btn > input{
            width: 60%;
            font-size: large;
            border-radius: 8px;
            margin-top: 20px;
            border-color: #5d5e5c;
            padding-left: 10px;
            padding-right: 10px;
            color: #5d5e5c;
        }

        .ml10 {
            margin-left: 10px;
        }

        .text-color {
            color: #60bdc2;
        }

        .cls-checkbox {
            width: 100px;
        }

        .get-mail > h1 {
            font-weight: 500;
        }

        .alert_pay {
            max-width: 500px;
            width: 80%;
            height: 500px;
            background-color: white;
            position: absolute;
            top: 30%;
            box-shadow: 1px 1px 9px 4px wheat;
            padding: 12px;
            text-align: center;
        }

        @media screen and (max-width: 530px) {
            body {
                width: 106%;
            }
            .blok-panel {
                width: 100%;
                top: 10%;
                max-width: 85%;
            }
        }
    </style>
</head>

                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 34.2 34.9"
                     onclick="onSelectConsentCH(false)"  class="cls-checkbox" id="idChON">
                    <defs>
                        <style>
                            .cls-1 {
                                fill: none;
                                stroke: #5e5e5c;
                                stroke-miterlimit: 10;
                            }
                        </style>
                    </defs>
                    <!-- Generator: Adobe Illustrator 28.7.1, SVG Export Plug-In . SVG Version: 1.2.0 Build 142)  -->
                    <g>
                        <g id="_Слой_1" data-name="Слой_1">
                            <rect class="cls-1" x=".9" y="1.3" width="32.3" height="32.3" rx="6.9" ry="6.9"/>
                        </g>
                    </g>
                </svg>

                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 34.2 34.9"
                     onclick="onSelectConsentCH(true)"  class="cls-checkbox" id="idChOFF">
                    <defs>
                        <style>
                            .cls-1 {
                                stroke: #5e5e5c;
                            }

                            .cls-1, .cls-2 {
                                fill: none;
                                stroke-miterlimit: 10;
                            }

                            .cls-2 {
                                stroke: #60bdc1;
                                stroke-width: 2px;
                            }
                        </style>
                    </defs>
                    <g>
                        <g id="_Слой_1" data-name="Слой_1">
                            <g>
                                <rect class="cls-1" x=".9" y="1.3" width="32.3" height="32.3" rx="6.9" ry="6.9"/>
                                <path class="cls-2" d="M6.9,17.6l5.3,8S23.3,9.6,26.3,6.9"/>
                            </g>
                        </g>
                    </g>
                </svg>
                <div id="idTextConsent" class="text-color-header" style="margin-left: 8px; margin-right: 8px;"></div>
                <button id="idBtnSaveEmailClinic" style="margin-top: initial;" class="btn" onclick="saveEmail(true)" disabled>ОПЛАТИТЬ</button>
            </div>
        </div>
    </div>

    <div class="text-color-header"
    style="margin-left: 58px; margin-right: 58px;">Чек по оплате будет доступен в разделе "Оплаты" Личного кабинета пациента по адресу: <a href="https://online.sokolovcenter.ru:8443">online.sokolovcenter.ru</a> </div>

</div>

<script>
    let initEmail = false;
    let emailVal = null;
    let btnPaySBP = document.getElementById("submitPaySBP");
    let btnPayCard = document.getElementById("submitPayCard");
    let p_formInputEmail = document.getElementById("formInputEmail");
    let p_inputEmail = document.getElementById("inputEmail");
    let p_btnEmail = document.getElementById("btnEmail");
    let p_btnEmailClinic = document.getElementById("btnEmailClinic");
    let timerID = null;  // Таймер проверки валидации

    let blockGetEmail = document.getElementById("idGetEmail");
    let blokSelectPay = document.getElementById("idSelectPay");
    let textEmailClinic = document.getElementById("idTextEmailClinic");
    let emailClinic = '';
    let textConsent = document.getElementById("idTextConsent");
    let btnSaveEmailClinic = document.getElementById("idBtnSaveEmailClinic");
    let chConsent = false;
    let ChOFF = document.getElementById("idChOFF");
    let ChON = document.getElementById("idChON");

    console.log('window.location=',  window.location.origin);

    function onSelectConsentCH(val){
        chConsent = val;
        setDisplay(ChOFF, !chConsent);
        setDisplay(ChON, chConsent);
        btnSaveEmailClinic.disabled = chConsent;
    }

    function validEmail(){
        p_btnEmail.disabled = !(p_inputEmail.validity.valid && p_inputEmail.value.length>3);
    }

    function setVisibility(elem, f){
        elem.style.visibility = f ? 'visible' : 'hidden';
    }

    function setDisplay(elem, f){
        elem.style.display = f ? 'block' : 'none';
    }

    // Нужно ввести почту
    function initInputEmail(flag){
        initEmail = flag;
        console.log('initEmail=', initEmail);

        if (initEmail) {
            // Скрываем оплаты
            setVisibility(blokSelectPay, false);
            // Показываем ввод почты
            setVisibility(blockGetEmail, true);
            textEmailClinic.textContent = emailClinic;
            textConsent.textContent = `Согласен на использование email ${emailClinic} и указание его в чеке в разделе "Покупатель"`;
            timerID = setInterval(() => validEmail(), 2000);
        } else {
            // Скрываем ввод почты
            setVisibility(blockGetEmail, false);
            // Показываем оплату
            setVisibility(blokSelectPay, true);
            // остановка таймера
            if (timerID) {clearTimeout(timerID)};
        }
    }

//
    var params = window
        .location
        .search
        .replace('?','')
        .split('&')
        .reduce(
            function(p,e){
                var a = e.split('=');
                p[ decodeURIComponent(a[0])] = decodeURIComponent(a[1]);
                return p;
            },
            {}
        );
    onSelectConsentCH(true);
    let orderid = params['orderid'];
    console.log('orderid=',  orderid);

    function GetPayIfoUrl(){
        const request = new XMLHttpRequest();
        request.open('GET', window.location.origin + '/payments/patient/payment_url?order_id='+orderid);
        request.setRequestHeader('Content-Type', 'application/json');
        request.responseType = 'json';
        request.onload = function() {
            if (request?.response?.success){
                console.log('request.response=',  request.response );
                console.log( 'request.response.success=', request.response.success);
                if (request.response.success === true) {
                    if (request.response.data && request.response.data.confirmationurl) {
                        location.href = request.response.data.confirmationurl;
                    } else {
                        console.log('URL - NOT res=', request.response);
                        // Првоерка на почту
                        if (request.response.data && request.response.data.email && request.response.data.email.length>3){
                            emailVal = request.response.data.email.trim();
                            // Все нормально, почта есть
                            initInputEmail(false);
                        } else {
                            emailClinic = request.response.data.emailclinic;
                            initInputEmail(true);
                            //Почты нет
                        }
                    }
                }
            } else {
                initInputEmail(true);
            }
        };
        request.send();
    }

    GetPayIfoUrl();

    function GetPay(url){
        const request = new XMLHttpRequest();
        request.open('GET', url);
        request.setRequestHeader('Content-Type', 'application/json');
        request.responseType = 'json';
        request.onload = function() {
            console.log('request.response=',  request.response );
            console.log( 'request.response.success=', request.response.success);
            if (request.response.success === false) {
                alert('Что-то пошло не так, попробуйте позднее.');
            } else {
                if (request.response.data && request.response.data.confirmationurl) {
                    location.href=request.response.data.confirmationurl;
                } else {
                    alert('Ошибка регистрации платежа.');
                }
            }
        };
        request.send();
    }

    function gooPaySBP() {
        GetPay(window.location.origin + '/pay/order?orderid='+orderid + '&pay=sbp' + '&email=' + emailVal);
    }

    function gooPayCard() {
        GetPay(window.location.origin + '/pay/order?orderid='+orderid + '&pay=card' + '&email=' + emailVal);
    }

    function saveEmail(f_clinick) {
        emailVal = f_clinick ? emailClinic : p_inputEmail.value;
        console.log(' saveEmail f_clinick=',  f_clinick);
        console.log(' saveEmail p_inputEmail=',  p_inputEmail.value.length);
        console.log(' saveEmail emailVal=',  emailVal);
        initInputEmail(false);
    }

    btnPaySBP.onclick = gooPaySBP;
    btnPayCard.onclick = gooPayCard;

/* вывод информации о перезапуске страницы */
    function alertBD() {
        let divAlert = document.createElement("div");
        divAlert.className = "alert_pay text-color-header";
        divAlert.innerHTML = `<h1>Что-то пошло не так, обновите страницу.</h1><button id="yes" class="btn">Обновить страницу</button>`;
        document.body.appendChild(divAlert);
        document.querySelector("#yes").onclick = () => {
            divAlert.remove();
            document.location.reload();
        }
    }

</script>

</body>
</html>
